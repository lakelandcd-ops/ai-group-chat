<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI 智囊团 (AI 董事会) / AI Group Chat</title>
    
    <!-- PWA & Mobile Web App Meta -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="AI智囊团">
    <meta name="theme-color" content="#07c160">
    <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🤖</text></svg>">

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
        .chat-bubble-left::before {
            content: ""; position: absolute; left: -8px; top: 12px;
            border-width: 6px 8px 6px 0; border-style: solid;
            border-color: transparent #ffffff transparent transparent;
        }
        .chat-bubble-right::before {
            content: ""; position: absolute; right: -8px; top: 12px;
            border-width: 6px 0 6px 8px; border-style: solid;
            border-color: transparent transparent transparent #95ec69;
        }
    </style>
</head>
<body class="bg-gray-100 h-screen flex flex-col font-sans antialiased text-gray-800 select-none">

    <!-- Top Navigation Bar -->
    <header class="bg-gray-800 text-white px-4 py-3 flex items-center justify-between shadow-md z-10 shrink-0">
        <div class="flex items-center space-x-3">
            <div class="w-9 h-9 rounded-full bg-emerald-500 flex items-center justify-center text-xl font-bold shadow">
                👥
            </div>
            <div>
                <h1 class="font-bold text-base leading-tight flex items-center gap-2">
                    <span>AI 智囊团 (AI 董事会)</span>
                    <span class="text-xs bg-emerald-600 px-2 py-0.5 rounded text-emerald-100 font-normal">v2.0</span>
                </h1>
                <p class="text-xs text-gray-400">AI Group Chat Boardroom</p>
            </div>
        </div>
        <div class="flex items-center space-x-2">
            <button onclick="toggleSidebar()" class="bg-gray-700 hover:bg-gray-600 text-white text-xs px-3 py-1.5 rounded-lg transition flex items-center gap-1.5 cursor-pointer">
                <i class="fa-solid fa-users-gear"></i>
                <span class="hidden sm:inline">成员与配置 / Config</span>
            </button>
        </div>
    </header>

    <!-- Main Container -->
    <div class="flex-1 flex overflow-hidden relative">

        <!-- Chat Area -->
        <main class="flex-1 flex flex-col bg-[#edeed3] bg-opacity-30 relative">
            
            <!-- Notice Banner -->
            <div id="pwa-banner" class="bg-emerald-50 border-b border-emerald-200 px-4 py-2 text-xs text-emerald-800 flex items-center justify-between shrink-0">
                <div class="flex items-center gap-2">
                    <i class="fa-solid fa-circle-info text-emerald-600"></i>
                    <span>提示：点击浏览器菜单选择“<b>添加到主屏幕</b>”可当作手机 App 使用 / Add to Home Screen as App</span>
                </div>
                <button onclick="document.getElementById('pwa-banner').remove()" class="text-emerald-600 hover:text-emerald-900 font-bold">&times;</button>
            </div>

            <!-- Messages Stream -->
            <div id="chat-messages" class="flex-1 overflow-y-auto p-4 space-y-4">
                
                <!-- System Welcome Message -->
                <div class="flex justify-center my-2">
                    <div class="bg-gray-200 text-gray-600 text-xs px-3 py-1.5 rounded-full shadow-sm text-center max-w-lg">
                        👋 欢迎来到多 AI 智囊团群聊！在右侧/顶部配置各 AI 的 API Key，即可开启自动接力讨论。<br>
                        Welcome! Configure API Keys in settings to start multi-AI auto-discussions.
                    </div>
                </div>

            </div>

            <!-- Discussion Control Bar (Auto & Manual Trigger) -->
            <div class="bg-white/80 backdrop-blur border-t border-gray-200 px-4 py-2 flex items-center justify-between shrink-0 gap-2 flex-wrap">
                <div class="flex items-center gap-2 text-xs text-gray-600">
                    <span class="font-medium">接力轮数 / Rounds:</span>
                    <select id="auto-rounds" class="border border-gray-300 rounded px-2 py-1 bg-white focus:outline-none">
                        <option value="1">1 轮 / 1 Round</option>
                        <option value="2" selected>2 轮 / 2 Rounds</option>
                        <option value="3">3 轮 / 3 Rounds</option>
                        <option value="5">5 轮 / 5 Rounds</option>
                    </select>
                </div>
                
                <div class="flex items-center gap-2">
                    <button id="start-discussion-btn" onclick="startAutoDiscussion()" class="bg-emerald-600 hover:bg-emerald-700 text-white text-xs px-3.5 py-1.5 rounded-lg shadow transition flex items-center gap-1.5 font-medium">
                        <i class="fa-solid fa-play"></i>
                        <span>开启 AI 接力讨论 / Start Auto-Discussion</span>
                    </button>
                    <button id="stop-discussion-btn" onclick="stopAutoDiscussion()" class="hidden bg-rose-600 hover:bg-rose-700 text-white text-xs px-3.5 py-1.5 rounded-lg shadow transition items-center gap-1.5 font-medium">
                        <i class="fa-solid fa-square"></i>
                        <span>停止讨论 / Pause</span>
                    </button>
                </div>
            </div>

            <!-- Input Bar -->
            <footer class="bg-white border-t border-gray-200 p-3 shrink-0">
                <form id="chat-form" onsubmit="handleUserSubmit(event)" class="flex items-end gap-2">
                    <textarea id="user-input" rows="2" placeholder="输入讨论议题 / Enter discussion topic or message..." class="flex-1 bg-gray-50 border border-gray-300 rounded-lg p-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:bg-white resize-none"></textarea>
                    <button type="submit" class="bg-emerald-600 hover:bg-emerald-700 text-white font-medium text-sm px-4 py-2.5 rounded-lg shadow transition shrink-0 h-[52px] flex items-center justify-center gap-1">
                        <span>发送</span>
                        <i class="fa-solid fa-paper-plane text-xs"></i>
                    </button>
                </form>
            </footer>
        </main>

        <!-- Sidebar / Member Settings Drawer -->
        <aside id="sidebar" class="absolute right-0 top-0 bottom-0 w-full sm:w-80 bg-white border-l border-gray-200 shadow-xl transform translate-x-full transition-transform duration-300 ease-in-out z-20 flex flex-col">
            <div class="p-4 border-b border-gray-200 flex items-center justify-between bg-gray-50">
                <h2 class="font-bold text-gray-700 flex items-center gap-2 text-sm">
                    <i class="fa-solid fa-users-gear text-emerald-600"></i>
                    <span>群成员与 API 配置 / Members & Settings</span>
                </h2>
                <button onclick="toggleSidebar()" class="text-gray-400 hover:text-gray-600 text-lg p-1">&times;</button>
            </div>

            <!-- Members List & API Key Form -->
            <div class="flex-1 overflow-y-auto p-4 space-y-4 text-xs" id="members-container">
                <!-- Members rendered dynamically -->
            </div>

            <!-- Sidebar Actions Footer -->
            <div class="p-3 border-t border-gray-200 bg-gray-50 space-y-2 shrink-0">
                <button onclick="addNewMember()" class="w-full bg-indigo-50 hover:bg-indigo-100 text-indigo-700 font-medium py-2 rounded border border-indigo-200 transition text-xs flex items-center justify-center gap-1">
                    <i class="fa-solid fa-user-plus"></i>
                    <span>+ 自定义 AI 成员 / Add Custom AI</span>
                </button>
                <div class="flex gap-2">
                    <button onclick="clearHistory()" class="flex-1 bg-gray-200 hover:bg-gray-300 text-gray-700 py-1.5 rounded transition text-xs flex items-center justify-center gap-1">
                        <i class="fa-solid fa-trash-can"></i>
                        <span>清空对话 / Clear</span>
                    </button>
                    <button onclick="downloadHTMLApp()" class="flex-1 bg-emerald-100 hover:bg-emerald-200 text-emerald-800 py-1.5 rounded transition text-xs flex items-center justify-center gap-1">
                        <i class="fa-solid fa-download"></i>
                        <span>离线保存 / Download</span>
                    </button>
                </div>
            </div>
        </aside>

    </div>

    <!-- Application JavaScript -->
    <script>
        // Preset Models Configuration
        const DEFAULT_MEMBERS = [
            {
                id: 'gemini',
                name: 'Gemini (分析师 / Analyst)',
                avatar: '♊',
                active: true,
                provider: 'google',
                model: 'gemini-1.5-flash',
                apiKey: '',
                baseUrl: 'https://generativelanguage.googleapis.com/v1beta/models',
                systemPrompt: '你是 Gemini，一位富有逻辑、理性客观的 AI 分析师。你可以使用中文或英文参与讨论。/ You are Gemini, an analytical and logical AI.'
            },
            {
                id: 'chatgpt',
                name: 'ChatGPT (策略师 / Strategist)',
                avatar: '🟢',
                active: true,
                provider: 'openai',
                model: 'gpt-4o-mini',
                apiKey: '',
                baseUrl: 'https://api.openai.com/v1/chat/completions',
                systemPrompt: '你是 ChatGPT，一位具有战略远见与综合创造力的顾问。你可以使用中文或英文参与讨论。/ You are ChatGPT, a creative and visionary strategist.'
            },
            {
                id: 'qwen',
                name: '千问 (市场官 / Marketer)',
                avatar: '👑',
                active: true,
                provider: 'dashscope',
                model: 'qwen-turbo',
                apiKey: '',
                baseUrl: 'https://dashscope.aliyuncs.com/compatible-mode/v1/chat/completions',
                systemPrompt: '你是通义千问，精通市场洞察与落地执行的专家。你可以使用中文或英文参与讨论。/ You are Qwen, a market insights specialist.'
            },
            {
                id: 'doubao',
                name: '豆包 (创意官 / Creative)',
                avatar: '🍞',
                active: true,
                provider: 'volcengine',
                model: 'doubao-lite-4k',
                apiKey: '',
                baseUrl: 'https://ark.cn-beijing.volces.com/api/v3/chat/completions',
                systemPrompt: '你是豆包，善于提供创新视角与新点子，思维发散、敢于提出不同方案的 AI。你可以使用中文或英文参与讨论。/ You are Doubao, a creative AI that offers fresh perspectives and bold ideas.'
            },
            {
                id: 'muse',
                name: 'Muse (执行官 / Executor)',
                avatar: '⚙️',
                active: true,
                provider: 'openai',
                model: '',
                apiKey: '',
                baseUrl: '',
                systemPrompt: '你是 Muse，注重执行、跟进、核对与落地，善于把讨论变成可执行步骤并推动完成。你可以使用中文或英文参与讨论。/ You are Muse, an execution-focused AI that turns discussion into actionable steps and follows through.'
            }
        ];

        let members = [];
        let messages = [];
        let isDiscussing = false;

        // Initialize App
        window.addEventListener('DOMContentLoaded', () => {
            loadFromLocalStorage();
            renderMembers();
            renderMessages();
        });

        // Toggle Sidebar
        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            if (sidebar) {
                sidebar.classList.toggle('translate-x-full');
            }
        }

        // Load & Save LocalStorage
        function loadFromLocalStorage() {
            const savedMembers = localStorage.getItem('ai_group_members_v2');
            if (savedMembers) {
                try { members = JSON.parse(savedMembers); } catch(e) { members = DEFAULT_MEMBERS; }
            } else {
                members = DEFAULT_MEMBERS;
            }

            const savedMessages = localStorage.getItem('ai_group_messages_v2');
            if (savedMessages) {
                try { messages = JSON.parse(savedMessages); } catch(e) { messages = []; }
            }
        }

        function saveToLocalStorage() {
            localStorage.setItem('ai_group_members_v2', JSON.stringify(members));
            localStorage.setItem('ai_group_messages_v2', JSON.stringify(messages));
        }

        // Render Members Settings UI
        function renderMembers() {
            const container = document.getElementById('members-container');
            if (!container) return;
            container.innerHTML = members.map((m, idx) => `
                <div class="border border-gray-200 rounded-lg p-3 bg-gray-50 space-y-2">
                    <div class="flex items-center justify-between">
                        <div class="flex items-center gap-2">
                            <input type="checkbox" ${m.active ? 'checked' : ''} onchange="updateMember(${idx}, 'active', this.checked)" class="rounded text-emerald-600 focus:ring-emerald-500 h-4 w-4">
                            <input type="text" value="${m.avatar}" onchange="updateMember(${idx}, 'avatar', this.value)" class="w-8 text-center border rounded py-0.5 bg-white">
                            <input type="text" value="${m.name}" onchange="updateMember(${idx}, 'name', this.value)" class="font-bold text-gray-700 border-b border-transparent focus:border-gray-400 bg-transparent px-1">
                        </div>
                        ${members.length > 1 ? `<button onclick="removeMember(${idx})" class="text-rose-500 hover:text-rose-700">&times;</button>` : ''}
                    </div>
                    
                    <div class="space-y-1">
                        <label class="text-[10px] font-semibold text-gray-500 uppercase">API Key:</label>
                        <input type="password" value="${m.apiKey || ''}" placeholder="粘贴 Key / Paste API Key..." onchange="updateMember(${idx}, 'apiKey', this.value)" class="w-full border rounded px-2 py-1 bg-white font-mono text-[11px]">
                    </div>

                    <div class="grid grid-cols-2 gap-2">
                        <div>
                            <label class="text-[10px] font-semibold text-gray-500 uppercase">Model ID:</label>
                            <input type="text" value="${m.model}" onchange="updateMember(${idx}, 'model', this.value)" class="w-full border rounded px-2 py-1 bg-white font-mono text-[11px]">
                        </div>
                        <div>
                            <label class="text-[10px] font-semibold text-gray-500 uppercase">Base URL:</label>
                            <input type="text" value="${m.baseUrl}" onchange="updateMember(${idx}, 'baseUrl', this.value)" class="w-full border rounded px-2 py-1 bg-white font-mono text-[11px]">
                        </div>
                    </div>

                    <div>
                        <label class="text-[10px] font-semibold text-gray-500 uppercase">System Prompt / 提示词:</label>
                        <textarea rows="2" onchange="updateMember(${idx}, 'systemPrompt', this.value)" class="w-full border rounded p-1.5 bg-white text-[11px] resize-none">${m.systemPrompt}</textarea>
                    </div>
                </div>
            `).join('');
            saveToLocalStorage();
        }

        function updateMember(idx, field, value) {
            members[idx][field] = value;
            saveToLocalStorage();
        }

        function addNewMember() {
            members.push({
                id: 'custom_' + Date.now(),
                name: 'Muse (执行官 / Executor)',
                avatar: '⚙️',
                active: true,
                provider: 'openai',
                model: 'gpt-3.5-turbo',
                apiKey: '',
                baseUrl: 'https://api.openai.com/v1/chat/completions',
                systemPrompt: '你是 Muse 执行官，注重执行、跟进、核对与落地。你可以使用中文或英文参与讨论。/ You are Muse, an execution-focused officer.'
            });
            renderMembers();
        }

        function removeMember(idx) {
            members.splice(idx, 1);
            renderMembers();
        }

        // Render Chat Messages UI
        function renderMessages() {
            const container = document.getElementById('chat-messages');
            if (!container) return;
            const welcomeNotice = container.querySelector('.flex.justify-center');
            container.innerHTML = '';
            if (welcomeNotice) container.appendChild(welcomeNotice);

            messages.forEach((msg) => {
                const isUser = msg.role === 'user';
                const div = document.createElement('div');
                div.className = `flex ${isUser ? 'justify-end' : 'justify-start'} items-start gap-2.5`;
                
                div.innerHTML = `
                    ${!isUser ? `<div class="w-9 h-9 rounded-full bg-white border border-gray-200 flex items-center justify-center text-lg shadow-sm shrink-0">${msg.avatar || '🤖'}</div>` : ''}
                    <div class="max-w-[80%] ${isUser ? 'items-end' : 'items-start'} flex flex-col">
                        <div class="text-[10px] text-gray-500 mb-1 px-1 flex items-center gap-1">
                            <span>${msg.sender}</span>
                            <span class="text-gray-300">•</span>
                            <span>${msg.time || ''}</span>
                        </div>
                        <div class="relative px-3.5 py-2.5 rounded-xl text-sm leading-relaxed shadow-sm ${
                            isUser 
                            ? 'bg-[#95ec69] text-gray-900 rounded-tr-none chat-bubble-right' 
                            : 'bg-white text-gray-800 rounded-tl-none chat-bubble-left border border-gray-100'
                        }">
                            <div class="whitespace-pre-wrap break-words">${escapeHTML(msg.content)}</div>
                        </div>
                    </div>
                    ${isUser ? `<div class="w-9 h-9 rounded-full bg-emerald-600 text-white flex items-center justify-center font-bold text-sm shadow-sm shrink-0">Me</div>` : ''}
                `;
                container.appendChild(div);
            });
            container.scrollTop = container.scrollHeight;
        }

        function escapeHTML(str) {
            return str.replace(/[&<>'"]/g, 
                tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
            );
        }

        // User Submit Message
        function handleUserSubmit(e) {
            e.preventDefault();
            const input = document.getElementById('user-input');
            const content = input.value.trim();
            if (!content) return;

            messages.push({
                role: 'user',
                sender: 'Me / 我',
                content: content,
                time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
            });

            input.value = '';
            saveToLocalStorage();
            renderMessages();
        }

        // Auto-Discussion Engine
        async function startAutoDiscussion() {
            if (isDiscussing) return;
            
            const activeMembers = members.filter(m => m.active && m.apiKey);
            if (activeMembers.length === 0) {
                alert('请先在侧边栏配置至少一位 AI 成员的 API Key！\nPlease configure at least one active AI member with API Key.');
                toggleSidebar();
                return;
            }

            isDiscussing = true;
            document.getElementById('start-discussion-btn').classList.add('hidden');
            document.getElementById('stop-discussion-btn').classList.remove('hidden');

            const rounds = parseInt(document.getElementById('auto-rounds').value) || 2;

            for (let r = 0; r < rounds; r++) {
                for (const member of activeMembers) {
                    if (!isDiscussing) break;

                    // Add thinking placeholder
                    const loadingMsg = {
                        role: 'assistant',
                        sender: member.name,
                        avatar: member.avatar,
                        content: '正在思考中 / Thinking...',
                        time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
                    };
                    messages.push(loadingMsg);
                    renderMessages();

                    try {
                        const replyContent = await callLLMAPI(member);
                        messages[messages.length - 1].content = replyContent;
                    } catch (error) {
                        messages[messages.length - 1].content = `⚠️ 请求失败 / API Error: ${error.message}`;
                    }
                    
                    saveToLocalStorage();
                    renderMessages();
                    await new Promise(res => setTimeout(res, 1200)); // Delay between AIs
                }
            }

            stopAutoDiscussion();
        }

        function stopAutoDiscussion() {
            isDiscussing = false;
            document.getElementById('start-discussion-btn').classList.remove('hidden');
            document.getElementById('stop-discussion-btn').classList.add('hidden');
        }

        // Unified API Call Handler
        async function callLLMAPI(member) {
            const contextHistory = messages.slice(0, -1).map(m => ({
                role: m.role === 'user' ? 'user' : 'assistant',
                content: `[${m.sender}]: ${m.content}`
            }));

            // Google Gemini API Protocol
            if (member.provider === 'google') {
                const url = `${member.baseUrl}/${member.model}:generateContent?key=${member.apiKey}`;
                const contents = contextHistory.map(m => ({
                    role: m.role === 'user' ? 'user' : 'model',
                    parts: [{ text: m.content }]
                }));

                const res = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: contents,
                        systemInstruction: { parts: [{ text: member.systemPrompt }] }
                    })
                });

                const data = await res.json();
                if (data.error) throw new Error(data.error.message);
                return data.candidates[0].content.parts[0].text;
            } 
            
            // OpenAI Compatible API Protocol (ChatGPT, Qwen, Doubao, Muse)
            else {
                const bodyMessages = [
                    { role: 'system', content: member.systemPrompt },
                    ...contextHistory
                ];

                const res = await fetch(member.baseUrl, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${member.apiKey}`
                    },
                    body: JSON.stringify({
                        model: member.model,
                        messages: bodyMessages,
                        temperature: 0.7
                    })
                });

                const data = await res.json();
                if (data.error) throw new Error(data.error.message || JSON.stringify(data.error));
                return data.choices[0].message.content;
            }
        }

        function clearHistory() {
            if (confirm('确定要清空所有聊天记录吗？/ Clear all messages?')) {
                messages = [];
                saveToLocalStorage();
                renderMessages();
            }
        }

        function downloadHTMLApp() {
            const blob = new Blob([document.documentElement.outerHTML], { type: 'text/html' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'index.html';
            a.click();
        }
    </script>
</body>
</html>
